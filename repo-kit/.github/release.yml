# Groups the automatically generated release notes by pull request label.
changelog:
  exclude:
    labels: [duplicate, invalid, wontfix]
  categories:
    - title: Breaking changes
      labels: ["breaking change"]
    - title: New features
      labels: [enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
